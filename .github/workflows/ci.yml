name: OmniHealth CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pandas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Check code style
        run: python -m ruff check .
      - name: Check Python syntax
        run: python -m compileall -q src
      - name: Run core tests
        run: python -m pytest -q
      - name: Run the synthetic demo
        run: make demo PYTHON=python
      - name: Exercise validation and reporting commands
        run: |
          make validate PYTHON=python
          make report PYTHON=python
      - name: Verify generated artifacts
        run: |
          test -s artifacts/demo/processed/events.csv
          test -s artifacts/demo/processed/sessions.csv
          test -s artifacts/demo/analytics/omnihealth.db
          test -s artifacts/demo/reports/data_quality.json
          test -s artifacts/demo/reports/pipeline_summary.json
          test -s artifacts/demo/reports/run_status.json
      - name: Verify the built wheel outside the source tree
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cp scripts/check_installed_package.py "$RUNNER_TEMP/check_installed_package.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" check_installed_package.py

  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev,spark]'
      - name: Compare Spark with pandas
        run: make test-spark PYTHON=python

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build the pandas container
        run: docker build -t omnihealth-ci .
      - name: Verify non-root execution and fixture metrics
        run: |
          test "$(docker run --rm --entrypoint id omnihealth-ci -u)" != "0"
          docker run --rm omnihealth-ci > /tmp/container-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/container-summary.json').read_text())
          assert summary['valid_events'] == 28
          assert summary['sessions'] == 8
          assert summary['converted_sessions'] == 4
          assert summary['source_type'] == 'synthetic_fixture'
          PY
