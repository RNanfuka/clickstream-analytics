name: OmniHealth CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pandas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Check code style
        run: python -m ruff check .
      - name: Check Python syntax
        run: python -m compileall -q src
      - name: Run core tests
        run: python -m pytest -q
      - name: Run the synthetic demo
        run: make demo PYTHON=python
      - name: Verify generated artifacts
        run: |
          test -s artifacts/demo/processed/events.csv
          test -s artifacts/demo/processed/sessions.csv
          test -s artifacts/demo/analytics/omnihealth.db
          test -s artifacts/demo/reports/data_quality.json
          test -s artifacts/demo/reports/pipeline_summary.json
