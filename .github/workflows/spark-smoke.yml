name: Optional PySpark smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMNIHEALTH_TEST_SPARK: '1'
      SPARK_LOCAL_IP: '127.0.0.1'
      PYSPARK_SUBMIT_ARGS: '--master local[2] --conf spark.sql.shuffle.partitions=2 pyspark-shell'
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install project with Spark
        run: python -m pip install -e '.[dev,spark]'
      - name: Run Spark integration tests
        run: python -m pytest -q tests/test_spark.py
